<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="title desc">
<title id="title">Quadro — animated current development architecture</title>
<desc id="desc">Voice or text requests reach the PySide6 interface and LangGraph supervisor. Work is routed to research, Windows automation, memory and skills. Destructive Windows actions pass an approval gate. Tool and knowledge results return to persistent state and the interface. This is an architecture illustration, not a recording of execution.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15172c"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#516f89"/></marker></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif}
.link{fill:none;stroke:#3b506c;stroke-width:1.6;marker-end:url(#arrow)}
.flow{fill:none;stroke:#67e8f9;stroke-width:1.4;stroke-dasharray:4 12;opacity:.65;animation:flow 3s linear infinite}
.route{animation:node 8s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
@keyframes node{50%{stroke-opacity:.4}}
@media(prefers-reduced-motion:reduce){.flow,.route{animation:none}.packet{display:none}}
</style>
