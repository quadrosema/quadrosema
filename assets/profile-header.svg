<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title desc">
  <title id="title">Amer Alomari — AI Engineer</title>
  <desc id="desc">Agent systems, retrieval and computer automation. Building Quadro. Animated connections link planning, context and action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14162d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#8b5cf6" stop-opacity=".18"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8fa4c9" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif}
    .mono{font-family:Consolas,Menlo,monospace}
    .orbit{transform-origin:782px 130px;animation:orbit 26s linear infinite}
    .signal{stroke-dasharray:5 10;animation:signal 4s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .cursor{animation:blink 1.2s steps(2,end) infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes signal{to{stroke-dashoffset:-60}}
    @keyframes pulse{50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.cursor{animation:none}}
  </style>
  <rect x=".5" y=".5" width="959" height="285" rx="18" fill="url(#bg)" stroke="#29344d"/>
  <rect x="1" y="1" width="958" height="284" rx="18" fill="url(#grid)"/>
  <circle cx="782" cy="130" r="150" fill="url(#halo)"/>
  <rect x="36" y="30" width="105" height="24" rx="12" fill="#16243a" stroke="#2d435a"/>
  <circle class="pulse" cx="50" cy="42" r="3" fill="#67e8f9"/>
  <text x="62" y="46" fill="#99b9ca" font-size="11" class="mono">quadrosema</text>
  <text x="36" y="87" fill="#a5b4fc" font-size="12" letter-spacing="3" font-weight="600">AI ENGINEER</text>
  <text x="32" y="142" fill="#f0f5ff" font-size="52" letter-spacing="-1.8" font-weight="700">AMER ALOMARI</text>
  <rect x="36" y="159" width="64" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="36" y="190" fill="#aab8d1" font-size="16">Agent systems · Retrieval · Computer automation</text>
  <text x="36" y="218" fill="#67e8f9" class="mono" font-size="12" letter-spacing=".6">BUILDING QUADRO</text>
  <g fill="none">
    <circle cx="782" cy="130" r="89" stroke="#3f4568" stroke-opacity=".6"/>
    <g class="orbit"><circle cx="782" cy="130" r="101" stroke="url(#accent)" stroke-opacity=".5" stroke-dasharray="45 590"/><circle cx="782" cy="29" r="3" fill="#a78bfa"/></g>
    <path d="M696 86L782 130L858 79M782 130L851 193M782 130L701 193" stroke="#344461"/>
    <path class="signal" d="M696 86L782 130L858 79M782 130L851 193M782 130L701 193" stroke="#67e8f9" stroke-opacity=".7"/>
    <rect x="748" y="96" width="68" height="68" rx="19" fill="#111e34" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="780" cy="128" r="16" stroke="url(#accent)" stroke-width="3"/>
    <path d="M788 139L799 150" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="mono" font-size="10" text-anchor="middle">
    <rect x="664" y="70" width="64" height="29" rx="8" fill="#17233b" stroke="#37435c"/><text x="696" y="89" fill="#8de5f1">PLAN</text>
    <rect x="818" y="62" width="79" height="29" rx="8" fill="#17233b" stroke="#37435c"/><text x="858" y="81" fill="#b6a0f9">CONTEXT</text>
    <rect x="670" y="179" width="63" height="29" rx="8" fill="#17233b" stroke="#37435c"/><text x="701" y="198" fill="#b6a0f9">TOOLS</text>
    <rect x="821" y="179" width="61" height="29" rx="8" fill="#17233b" stroke="#37435c"/><text x="851" y="198" fill="#8de5f1">ACT</text>
  </g>
  <path d="M24 242H936" stroke="#29344d"/>
  <text x="36" y="266" fill="#8596b4" class="mono" font-size="11"><tspan fill="#a78bfa">&gt;</tspan> reason <tspan fill="#586a89">→</tspan> retrieve <tspan fill="#586a89">→</tspan> act<tspan class="cursor" fill="#67e8f9">_</tspan></text>
  <text x="924" y="266" fill="#8596b4" class="mono" font-size="11" text-anchor="end">AMMAN, JORDAN</text>
</svg>
